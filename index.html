<body>
<!--
  このページは土台だけで、各画面のHTMLは html/ フォルダに分けている。
  data-include の位置に、js/boot.js がページを開いた時に部品を読み込んで差し込む。
  （部品の読み込みに fetch を使うため、ローカルで確認する時もローカルサーバーで開くこと）
-->
<div id="app">
  <div class="fog-layer"></div>
  <div class="embers" id="embers"></div>
  <div class="sound-control">
    <span class="bgm-label">BGM</span>
    <button class="icon-btn global-sound-btn" id="btn-mute" title="音声のON/OFF">🔊</button>
  </div>

  <main>
    <div data-include="html/screens/title.html"></div>
    <div data-include="html/screens/error.html"></div>
    <div data-include="html/screens/mode.html"></div>
    <div data-include="html/screens/quiz.html"></div>
    <div data-include="html/screens/result.html"></div>
  </main>

  <footer class="credit">MADE BY NAGATSUKI</footer>

  <div data-include="html/overlays/feedback.html"></div>
  <div data-include="html/overlays/confirm.html"></div>
  <div data-include="html/overlays/resume.html"></div>
  <div data-include="html/overlays/info.html"></div>
  <div data-include="html/overlays/notes.html"></div>
  <div data-include="html/kaii.html"></div>
</div>

<script src="js/boot.js"></script>

<!-- ============================================================
     怪異演出（css/kaii.css・js/kaii.js）
     ※制限時間の表示（#kaii-timer）はクイズ画面の中にあるため html/screens/quiz.html に置いている
     ============================================================ -->

<!-- ▼ 段階2の背景（赤い闇）。#app.kaii-active の間だけ表示 -->
<div class="kaii-bg" aria-hidden="true"></div>

<!-- ▼ 段階2の前面ノイズ（操作を妨げないよう pointer-events:none） -->
<div class="kaii-ambient" aria-hidden="true">
  <video class="kaii-static" data-kaii-video src="assets/kaii/static.mp4" muted loop playsinline preload="none"></video>
  <div class="ka-scan"></div>
  <div class="ka-tear"></div>
  <div class="ka-vignette"></div>
</div>
<!-- ▼ 時間内に正解した時の「祓い」の光 -->
<div class="kaii-purify" id="kaii-purify" aria-hidden="true"></div>

<!-- ▼ 段階1（予兆）。次の問題が表示される前に全画面で覆う -->
<div class="kaii-omen" id="kaii-omen" aria-hidden="true">
  <div class="ko-red"></div>
  <video class="kaii-static" data-kaii-video src="assets/kaii/static.mp4" muted loop playsinline preload="none"></video>
  <div class="ko-slices"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="ko-text">―來る</div>
</div>

<!-- ▼ 段階3（罰）。data-variant で3種類のうち1つを表示する -->
<div class="kaii-punish" id="kaii-punish" aria-hidden="true">

  <!-- 1. 一つ目（しめ縄の向こうの一つ目の怪物 → 目の大写し → 飛びかかってくる → 黒画面。動画の音声も使う） -->
  <!-- 素材：Runwayで生成した動画（_materials/Ghost Eye.mp4 を切り出さずに再圧縮）。動画のあとの黒画面はdata-phaseで切替 -->
  <div class="kp-scene kp-eye" id="kp-eye">
    <video class="kp-video kp-eye-video" id="kp-eye-video" data-kaii-video src="assets/kaii/ghost_eye.mp4" playsinline preload="none"></video>
  </div>

  <!-- 2. 白い女（障子越しのシルエット → 姿が消える → 白い顔が飛び出してくる。動画の音声も使う） -->
  <!-- 素材：Runwayで生成した動画（_materials/白い女.mp4 を先頭から5.3秒に切り出し） -->
  <div class="kp-scene kp-face">
    <video class="kp-video kp-face-video" id="kp-face-video" data-kaii-video src="assets/kaii/white_woman.mp4" playsinline preload="none"></video>
  </div>

  <!-- 3. 陰陽師の霊（参道に立つ陰陽師 → 文字が埋め尽くす → 白い光 → 青い亀裂 → 黒画面。動画の音声も使う） -->
  <!-- 素材：Runwayで生成した動画（_materials/陰陽師.mp4 を切り出さずに再圧縮）。動画のあとの黒画面はdata-phaseで切替 -->
  <div class="kp-scene kp-onmyoji" id="kp-onmyoji">
    <video class="kp-video kp-onmyoji-video" id="kp-onmyoji-video" data-kaii-video src="assets/kaii/onmyoji.mp4" playsinline preload="none"></video>
  </div>
</div>

<!-- ▼ タイトル画面 -->
<section id="screen-title" class="screen active">
  <!-- 開発者手記（更新履歴）のモーダルを開く（js/screens/notes.js）。和紙の御札風（css/title.css）。
       他の画面の「タイトルへ戻る」と同じく左上に置き、中央のレイアウトに影響させない -->
  <button class="notes-ofuda" id="btn-release-notes"><span class="notes-ofuda-seal" aria-hidden="true">書</span>開発者手記</button>
  <div class="glyph-guard">魑</div>
  <div class="title-block">
    <!-- 「解」が不規則に一瞬だけ「怪」に入れ替わる（js/screens/title.js）。読み上げは常に正式名称にする -->
    <h1 aria-label="宵闇漢字解奇譚"><span aria-hidden="true">宵闇漢字<span class="title-flicker" id="title-flicker">解</span>奇譚</span></h1>
    <div class="seal-divider"></div>
    <p class="sub title-overview">怪異、呪術、宗教等にまつわる<br>漢字の読みを当てる奇譚。<br>"怪異乱入"時、心してかかるように――</p>
  </div>
  <button class="btn-start" id="btn-open-seal">封を解く</button>
  <p class="title-hint" id="title-hint"></p>
</section>
